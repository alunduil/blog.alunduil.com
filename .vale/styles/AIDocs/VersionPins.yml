# A version pinned in prose has no sensor behind it: the lockfile moves,
# Renovate opens the PR, and the sentence keeps asserting the old number.
# Name the file that holds the pin instead.
#
# Only versions. Dates were the other half of this tell and didn't
# survive calibration — "as of 2026-07" stamping a measurement and a
# stale "supported through 2026" are the same shape to a regex, and
# telling them apart is the model's job.
#
# Backticked versions are already quiet, because Vale doesn't read inline
# code. That's what keeps this off quoted commands and dependency pins.

extends: existence
message: "Version pinned in prose: '%s'. Point at the file that holds the pin."
level: error
nonword: true
tokens:
  - '\bv\d+\.\d+(?:\.\d+)?\b'
  - '\bversion \d+\.\d+(?:\.\d+)?\b'
  - '\b\d+\.\d+(?:\.\d+)?\+'
