# A version pinned in prose has no sensor behind it: the lockfile moves,
# Renovate opens the PR, and the sentence keeps asserting the old number.
# Name the file that holds the pin instead.
#
# Versions only. A date stamping a measurement ("as of 2026-07") and a
# stale claim ("supported through 2026") are the same shape to a regex,
# so dates are the model's call.
#
# Vale doesn't read inline code, so a backticked version in a command or
# a dependency pin stays quiet.

extends: existence
message: "Version pinned in prose: '%s'. Point at the file that holds the pin."
level: error
nonword: true
tokens:
  - '\bv\d+\.\d+(?:\.\d+)?\b'
  - '\bversion \d+\.\d+(?:\.\d+)?\b'
  - '\b\d+\.\d+(?:\.\d+)?\+'
