# A committed pointer to where a credential lives is prompt-injection
# bait for whatever reads the repo next: it hands an attacker the path
# without them having to find it.
#
# Proximity, not the path alone. `~/.claude/voice.md` is an ordinary
# cross-reference; "token in ~/.config/foo/token" is the disclosure. The
# credential noun and the location have to appear within one clause of
# each other, and either can come first.
#
# The gap admits dots and newlines because the path itself carries dots
# and the prose wraps mid-sentence — `[^.\n]` would stop at the first
# `/.config`. Vale reads the paragraph, so the two halves still have to
# land within 40 characters of each other.

extends: existence
message: "Secret-location pointer: '%s'. Name the tool, not the path."
level: error
ignorecase: true
nonword: true
tokens:
  # Credential noun, then a location.
  - '\b(?:token|secret|credential|password|passphrase|api[ _-]?key|private key)s?\b[^.]{0,40}(?:~/|\$HOME|/etc/|/run/secrets|\.env\b|\.netrc\b)'
  # Location, then a credential noun.
  - '(?:~/|\$HOME|/etc/|/run/secrets|\.env\b|\.netrc\b)[^.]{0,40}\b(?:token|secret|credential|password|passphrase|api[ _-]?key|private key)s?\b'
