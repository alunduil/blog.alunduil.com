# A committed pointer to where a credential lives is prompt-injection
# bait for whatever reads the repo next: it hands an attacker the path
# without them having to find it.
#
# Proximity, not the path alone. `~/.claude/voice.md` is an ordinary
# cross-reference; "token in ~/.config/foo/token" is the disclosure. The
# two halves have to land within a clause of each other, and either can
# come first.
#
# `raw` concatenates its list into one pattern, so each half is written
# once and reused by YAML anchor. RE2 has no subroutine references and
# Vale rejects a rule file carrying keys of its own, which leaves the
# anchor-on-a-list-element as the one place a shared fragment can live.
# Writing the alternations twice instead would let the two directions
# drift apart on the next noun added.
#
# The gap admits dots and newlines because the path itself carries dots
# and the prose wraps mid-sentence — `[^.\n]` would stop at `/.config`.

extends: existence
message: "Secret-location pointer: '%s'. Name the tool, not the path."
level: error
ignorecase: true
nonword: true
raw:
  - '(?:'
  - &credential '\b(?:token|secret|credential|password|passphrase|api[ _-]?key|private key)s?\b'
  - &gap '[^.]{0,40}'
  - &location '(?:~/|\$HOME|/etc/|/run/secrets|\.env\b|\.netrc\b)'
  - '|'
  - *location
  - *gap
  - *credential
  - ')'
