# A committed pointer to where a credential lives is prompt-injection
# bait for whatever reads the repo next. Agent instruction files are read
# with something close to system-prompt authority, so a path written here
# is reconnaissance for anything that redirects the agent.
#
# The two halves have to land within a clause of each other, and either
# can come first. Naming a credential near a path is not enough on its
# own: "store credentials in the environment, never in /etc/app/config"
# is the advice, not the disclosure, and "the password prompt appears
# when ~/.ssh has no key" is mechanism. So the credential-first direction
# also needs a locative verb — the shape that actually says where the
# thing is kept. The location-first direction takes a plain gap, where
# `/etc/secrets/deploy.pem` is already the disclosure.
#
# `raw` concatenates its list into one pattern, so each half is written
# once and reused by anchor. RE2 has no subroutine references and Vale
# rejects a rule file carrying keys of its own, so a YAML anchor on a
# list element is where a shared fragment can live.
#
# The gaps admit dots and newlines because the path carries dots and the
# prose wraps mid-sentence.

extends: existence
message: "Secret-location pointer: '%s'. Name the tool, not the path."
level: error
ignorecase: true
nonword: true
raw:
  - '(?:'
  # Credential noun, a verb of location, then the path.
  - &credential '\b(?:token|secret|credential|password|passphrase|api[ _-]?key|private key)s?\b'
  - '[^.]{0,20}(?:lives?|sits?|resides?|is stored|are stored|is kept|are kept)[^.]{0,20}'
  - &location '(?:~/|\$HOME|/etc/|/run/secrets|\.env\b|\.netrc\b)'
  - '|'
  # Path first, then the credential noun.
  - *location
  - '[^.]{0,40}'
  - *credential
  - ')'
