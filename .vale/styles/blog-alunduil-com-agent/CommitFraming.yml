# AI-targeted docs load whole on every relevant turn. Prose narrating a
# change spends that context on a state the reader can't observe and
# leaves the dead approach in it; the commit already holds the history.
#
# "used to" also means "employed to" — "the flag used to pin the
# version" — so it fires only after "we" or beside a state verb.

extends: existence
message: "Commit-message framing: '%s'. Describe the repo at HEAD."
level: error
ignorecase: true
tokens:
  - 'we used to'
  - 'used to (?:be|live|sit|run|have|keep)'
  - 'previously'
  - 'no longer'
  - 'formerly'
  - 'as (?:mentioned|noted|described) (?:above|earlier|below)'
