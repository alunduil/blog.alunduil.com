cache = true
# Shorter than the weekly.yml cadence, so every scheduled run re-checks the
# whole site cold and only a same-week re-dispatch reuses the cache.
max_cache_age = "6d"
# A transient 5xx or a rate-limit is not link rot. Caching one would keep a
# false report open for the life of the entry.
cache_exclude_status = "429, 500.."
retry_wait_time = 5
# Every page carries the same nav and footer, so a handful of hosts get asked
# for the same URLs dozens of times over. Fewer and more patient requests than
# the defaults, which read a slow answer under that load as a dead link.
max_concurrency = 8
timeout = 30
include_fragments = "anchor-only"

# Links a browser opens and an automated client is refused — every time, on
# any user agent. One URL at a time, never a domain: a domain also stops
# reporting the day that link truly breaks, and every future link to the same
# site. An entry asserts the link is good, so prove that somewhere other than
# the host doing the blocking, which will describe a URL that never existed in
# exactly the same words. Absent proof the link stays in the report, and
# retries won't help — lychee retries transport failures, never a refusal it
# can read.
exclude = [
  # Serves 200 to a browser; LinkedIn answers 999 to everything else.
  "^https://www\\.linkedin\\.com/in/alunduil/$",
  # G-Research/bobbit, confirmed through registry.npmjs.org.
  "^https://www\\.npmjs\\.com/package/bobbit$",
  # Shaw and Nave, "Thinking—Fast, Slow, and Artificial"; SSRN sits behind a
  # Cloudflare challenge.
  "^https://papers\\.ssrn\\.com/sol3/papers\\.cfm\\?abstract_id=6097646$",
  # Not bot protection: the 404 page's own canonical URL, a 404 by design.
  "^https://blog\\.alunduil\\.com/404/$",
]

# Skip content that isn't ours to fix. .vale/styles/ are upstream Vale
# style packages; outlines/ are planning scaffolding, not published
# content.
exclude_path = [
  "(^|/)\\.vale/styles/",
  "(^|/)outlines/",
]
