name: Build the site
description: Build the Astro site into dist/ on the Node version pinned in .node-version.

runs:
  using: composite
  steps:
    # withastro/action takes the version only as an input, not as a file.
    - id: node
      shell: bash
      run: echo "version=$(<.node-version)" >>"${GITHUB_OUTPUT}"
    - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
      env:
        # Public by design: the page emits it in its rel="webmention" link.
        # Committed rather than an Actions Variable so the webmention
        # receiver is configured as code.
        PUBLIC_WEBMENTION_IO_USERNAME: blog.alunduil.com
      with:
        node-version: ${{ steps.node.outputs.version }}
