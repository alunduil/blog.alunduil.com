name: Lychee

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main so each commit completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: .lycheecache
          key: lychee-cache-${{ hashFiles('lychee.toml', '**/*.md') }}
          restore-keys: lychee-cache-
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Scan the tree, not a glob: the action's shell expands '**/*.md'
          # to '*/*.md' (one level deep), so a single one-level file would
          # hijack it. lychee walks for markdown/html; exclude_path filters.
          args: '.'
