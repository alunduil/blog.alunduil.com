name: Issues

on:
  issues:
    types: [opened]
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true

permissions:
  issues: write

jobs:
  ideas:
    name: Label idea issues
    if: inputs.dry-run || contains(github.event.issue.body, '## Spark')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - if: inputs.dry-run
        run: gh api "repos/$REPO/labels/idea" --silent
      - if: ${{ !inputs.dry-run }}
        run: gh issue edit "$NUMBER" --repo "$REPO" --add-label idea
        env:
          NUMBER: ${{ github.event.issue.number }}
