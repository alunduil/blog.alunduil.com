name: CD

on:
  push:
    branches: [main]
  schedule:
    # Refresh webmentions from webmention.io through the day; the static
    # display is otherwise frozen between builds.
    - cron: "0 */6 * * *"
    # Fires at 07:50 so the scheduled-post margin reveals posts dated 08:00
    # and the deploy lands them by 08:00, even if Actions delays the run.
    - cron: "50 7 * * *"
      timezone: "Europe/London"
  workflow_dispatch:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build for deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-site

  # A deploy stuck waiting on its environment never reaches a runner, so
  # timeout-minutes never ends it and it holds the pages group.
  release-stuck-deploy:
    name: Release a stuck Pages deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      STUCK_AFTER: 30 minutes
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: stuck
        name: Find CD runs waiting over ${{ env.STUCK_AFTER }}
        env:
          # A called workflow's github.workflow is the caller's name.
          WORKFLOW: cd.yml
        run: |
          cutoff=$(date -u -d "$STUCK_AFTER ago" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh run list --workflow "$WORKFLOW" --status waiting \
            --created "<$cutoff" --json databaseId --jq '.[].databaseId')
          for id in $ids; do
            echo "::warning::CD run $id has waited since before $cutoff"
          done
          echo "ids=${ids//$'\n'/ }" >>"${GITHUB_OUTPUT}"
      - name: Cancel them
        if: ${{ !inputs.dry-run && steps.stuck.outputs.ids != '' }}
        env:
          IDS: ${{ steps.stuck.outputs.ids }}
        run: |
          for id in $IDS; do
            gh run cancel "$id"
          done

  publish:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # A transient Pages API failure would otherwise hold a scheduled
      # post until the next cron.
      - id: deployment
        name: Deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        name: Retry the deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
