name: CD

on:
  push:
    branches: [main]
  schedule:
    # Refresh webmentions from webmention.io through the day; the static
    # display is otherwise frozen between builds.
    - cron: "0 */6 * * *"
    # Fires at 07:50 so the scheduled-post margin reveals posts dated 08:00
    # and the deploy lands them by 08:00, even if Actions delays the run.
    - cron: "50 7 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-site

  publish:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # A transient Pages API failure would otherwise hold a scheduled
      # post until the next cron.
      - id: deployment
        name: Deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        name: Retry the deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
