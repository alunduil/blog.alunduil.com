name: Weekly

on:
  schedule:
    # Wednesdays at 07:00 Europe/London, clear of the Tuesday and Sunday
    # publication slots. The timezone field handles BST/GMT.
    - cron: '0 7 * * 3'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ref-less group so a manual dispatch and the schedule can't run
  # concurrently and race on the shared report issue; cancel rather than
  # queue so a fresh dispatch supersedes an in-flight run.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # External URLs rot from time and third parties, not from the diff, so
  # checking them per-PR produces failures no author can act on. Check them
  # weekly and open an issue instead of blocking the line. Never fails.
  links:
    name: Check links across the published site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      # Matches pages.yml so the tree built here carries the same webmention
      # link as the deployed one.
      PUBLIC_WEBMENTION_IO_USERNAME: blog.alunduil.com
      # renovate: datasource=node-version depName=node extractVersion=^v(?<version>.+)$
      NODE_VERSION: "24"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-cache-${{ hashFiles('lychee.toml', '**/*.md') }}
          restore-keys: lychee-cache-

      # The site is static, so every published page is a file under dist/ and
      # walking it reaches everything a crawler would: posts, tag pages,
      # pagination, archives, and the shared nav and footer on each. Building
      # is what makes the site's own links checkable at all — `/posts/...`
      # resolves against neither the source tree nor the markdown.
      - uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager: pnpm@11.21.0

      # --root-dir is what resolves those root-relative links, so it has to be
      # the build output and an absolute path. Each page's canonical tag is an
      # absolute URL, so this checks the live deploy on the way past.
      - name: Check links across the built site
        id: site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: '--no-progress --root-dir ${{ github.workspace }}/dist dist'
          output: ./lychee/site.md
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Repo docs never reach dist/, so nothing above sees their links. Post
      # sources are skipped here because the built pages already cover them.
      - name: Check links in repo docs
        id: docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: '--no-progress --exclude-path (^|/)(src/data/blog|dist)/ .'
          output: ./lychee/docs.md
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine reports
        if: steps.site.outputs.exit_code != 0 || steps.docs.outputs.exit_code != 0
        run: cat ./lychee/site.md ./lychee/docs.md >./lychee/out.md

      # Reuse the open report if one exists so repeated breakage updates a
      # single issue instead of filing a new one every week.
      - name: Find existing report issue
        if: steps.site.outputs.exit_code != 0 || steps.docs.outputs.exit_code != 0
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'Link Checker Report in:title' --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Open or update issue on broken links
        if: steps.site.outputs.exit_code != 0 || steps.docs.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.report.outputs.number }}
          labels: bug
