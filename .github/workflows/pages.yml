name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild to refresh webmentions from webmention.io; the static
    # display is otherwise frozen at the last content push. See #148.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Public by design (Astro PUBLIC_ prefix; emitted in the page's
      # rel="webmention" link). Committed here rather than an Actions
      # Variable so the webmention receiver is configured as IaC. See #148.
      PUBLIC_WEBMENTION_IO_USERNAME: blog.alunduil.com
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: withastro/action@b7d53628f8b666036b0238aadb0b984a2a489f26 # v6
        with:
          node-version: "22"
          package-manager: pnpm@11.4.0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
