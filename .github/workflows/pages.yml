name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh webmentions from webmention.io through the day; the static
    # display is otherwise frozen between builds. See #148.
    - cron: "0 */6 * * *"
    # Publish posts dated 08:00 Europe/London (see CLAUDE.md posting
    # convention). Fires at 07:50 so scheduledPostMargin (15 min) reveals
    # the post and build + deploy lands it by ~08:00 even if Actions
    # delays the run.
    - cron: "50 7 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Public by design (Astro PUBLIC_ prefix; emitted in the page's
      # rel="webmention" link). Committed here rather than an Actions
      # Variable so the webmention receiver is configured as IaC. See #148.
      PUBLIC_WEBMENTION_IO_USERNAME: blog.alunduil.com
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: withastro/action@b7d53628f8b666036b0238aadb0b984a2a489f26 # v6
        with:
          node-version: "22"
          package-manager: pnpm@11.5.2

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
