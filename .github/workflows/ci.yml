name: CI

# Everything gating a pull request, colocated: `on:` is the only setting that
# can't be scoped per job, so a shared trigger is what makes one file correct.
# Nothing here repeats on push to main — main takes changes only through a PR
# under a strict required-check rule, so these already ran against the tree
# that lands, and pages.yml rebuilds the site on merge regardless.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node + pnpm so the local eslint/prettier hooks resolve the repo's
      # own toolchain. pnpm version comes from package.json packageManager.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The lychee hook is `language: system`; runners ship no lychee.
      - run: scripts/install-lychee.sh
      - uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  bats:
    name: Test skill scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          # Override defaults of true; skill tests don't load helper libs.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # bats-action curls api.github.com; auth raises the anonymous rate limit.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        # -r recurses; future skills with *.bats files are picked up automatically.
        run: bats -r .claude/skills

  build:
    name: Build the site
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=node-version depName=node extractVersion=^v(?<version>.+)$
      NODE_VERSION: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
