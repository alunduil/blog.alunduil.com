# Vale configuration for blog.alunduil.com.
# https://vale.sh/docs/topics/config/

StylesPath = .vale/styles

Packages = Microsoft, proselint, alex

Vocab = Custom

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex

# YAML frontmatter is config, not prose.
BlockIgnores = (?sm)^---$.*?^---$

# Personal voice: contractions and first person are the point.
Microsoft.Contractions = suggestion
Microsoft.FirstPerson = suggestion

# Strict mechanic: Oxford comma is required.
Microsoft.OxfordComma = error
