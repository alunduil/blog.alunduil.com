# Vale configuration for blog.alunduil.com.
# https://vale.sh/docs/topics/config/

StylesPath = .vale/styles

Packages = Microsoft, proselint, alex, Readability

Vocab = Custom

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, Custom

# YAML frontmatter is config, not prose.
BlockIgnores = (?sm)^---$.*?^---$

# Custom.Spelling enforces en_GB via a vendored Hunspell dictionary;
# the built-in en_US check would fight it.
Vale.Spelling = NO

# Microsoft prefers contractions; default `error` would block formal
# voice ("do not", "is not"). Suggestion preserves tonal range.
Microsoft.Contractions = suggestion

# Dates are RFC 3339 (YYYY-MM-DD), matching the ISO 8601 frontmatter
# timestamps. The Microsoft rule mandates US "Month DD, YYYY"; disable it.
# Custom.DateFormat enforces the RFC 3339 form instead.
Microsoft.DateFormat = NO

# A personal blog is first person by design (titles like "How I Read");
# the impersonal-voice rule is all false positives here.
Microsoft.FirstPerson = NO

# AI-targeted markdown is terse imperative config prose, so the human
# styles above are all false positives on it: no contractions to prefer,
# no passive voice to flag, no en_GB dictionary that holds the tool names.
# A later section replaces BasedOnStyles rather than adding to it, which
# is what scopes them off (and why the post sections below repeat the
# whole list to keep them).
#
# AIDocs runs here instead: the deterministic subset of the AI-doc
# conventions in CLAUDE.md. Rules a regex can't decide — token
# efficiency, positive-over-negative framing, whether a date is a rot
# marker or a deliberate measurement stamp — stay with the model.
#
# outlines/ is out. It holds scene-and-beat planning for narrative posts,
# where "the aggregator I no longer needed" is a scene title, not
# commit-message framing.
[{CLAUDE.md,.claude/*.md,.claude/**/*.md}]
BasedOnStyles = AIDocs

# Replacing BasedOnStyles doesn't undo a rule named outright: the
# Microsoft.Contractions level set above enables that one rule here on its
# own. Naming it again is what turns it off.
Microsoft.Contractions = NO

# Blog posts carry a hard reading-level gate—Flesch Reading Ease >= 70,
# "plain English"—that repo docs don't. Only this metric runs; the
# Readability package's other six stay off.
[src/data/blog/*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, Custom, Readability
Readability.FleschReadingEase = error
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# Reviews sit one folder deeper but are current author content, so the same
# gate applies. Archival subdirs (_<engine>) stay exempt by not matching
# either scope.
[src/data/blog/reviews/*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, Custom, Readability
Readability.FleschReadingEase = error
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
