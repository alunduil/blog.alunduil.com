# Vale configuration for blog.alunduil.com.
# https://vale.sh/docs/topics/config/

StylesPath = .vale/styles

Packages = Microsoft, proselint, write-good, alex, Readability

Vocab = Custom

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, write-good, alex, Readability

# YAML frontmatter is config, not prose.
BlockIgnores = (?sm)^---$.*?^---$

# Tone: contractions and first person fit a personal blog.
Microsoft.Contractions = warning
Microsoft.FirstPerson = suggestion
Microsoft.We = suggestion

# House style: spaced em-dash (` — `) is intentional throughout.
Microsoft.Dashes = NO

# Passive voice is sometimes the right choice in technical writing.
write-good.Passive = suggestion

# Inclusive language errors stay errors.
alex.Race = error
alex.Gender = error
alex.Sexual-orientation = error
