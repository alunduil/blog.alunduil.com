# Vale configuration for blog.alunduil.com.
# https://vale.sh/docs/topics/config/

StylesPath = .vale/styles

Packages = Microsoft, proselint, alex, Readability

Vocab = blog-alunduil-com

# IgnoredScopes replaces Vale's default list, so this line restores it.
# Repeated IgnoredScopes lines accumulate.
IgnoredScopes = tt, code, kbd, samp

# Vale lints each top-level string field of YAML frontmatter as prose,
# scoped text.frontmatter.<key>. Of the post schema's string fields, only
# title and description are prose. The rest hold paths and identifiers.
IgnoredScopes = text.frontmatter.author, text.frontmatter.ogImage, text.frontmatter.canonicalURL, text.frontmatter.timezone

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, blog-alunduil-com

# blog-alunduil-com.Spelling enforces en_GB via a vendored Hunspell
# dictionary; the built-in en_US check would fight it.
Vale.Spelling = NO

# Microsoft prefers contractions; default `error` would block formal
# voice ("do not", "is not"). Suggestion preserves tonal range.
Microsoft.Contractions = suggestion

# Dates are RFC 3339 (YYYY-MM-DD), matching the ISO 8601 frontmatter
# timestamps. The Microsoft rule mandates US "Month DD, YYYY"; disable it.
# blog-alunduil-com.DateFormat enforces the RFC 3339 form instead.
Microsoft.DateFormat = NO

# A personal blog is first person by design (titles like "How I Read");
# the impersonal-voice rule is all false positives here.
Microsoft.FirstPerson = NO

# Blog posts carry a hard reading-level gate—Flesch Reading Ease >= 70,
# "plain English"—that repo docs don't. Only this metric runs; the
# Readability package's other six stay off.
[src/data/blog/*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, blog-alunduil-com, Readability
Readability.FleschReadingEase = error
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# Reviews sit one folder deeper but are current author content, so the same
# gate applies. Archival subdirs (_<engine>) stay exempt by not matching
# either scope.
[src/data/blog/reviews/*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, blog-alunduil-com, Readability
Readability.FleschReadingEase = error
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
