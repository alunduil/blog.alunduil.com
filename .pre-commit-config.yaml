---
# Pre-commit hooks for code quality and consistency.
# See https://pre-commit.com for usage.

# Vale ships its style packages under .vale/styles/ as upstream content.
# No hook should touch them.
exclude: ^\.vale/styles/

repos:
  # Shell linting and formatting (digest skill collect.sh and any future scripts)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]
        types: [shell]

  # YAML linting (workflows, frontmatter, pre-commit config itself)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # GitHub Actions workflow linting. v1.7.12+ validates the schedule
  # `timezone:` key used in pages.yml.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Link checking. The system binary (scripts/install-lychee.sh) rather than
  # the upstream auto-installing hook: one version pin, and the static musl
  # build runs on images whose GLIBC the upstream binary rejects.
  #
  # --offline holds the gate to what resolves without a build, so it never
  # flakes on a third party; weekly.yml checks whatever needs its target to
  # exist.
  #
  # --base-url is the only difference between the two hooks. A post's
  # `/posts/...` addresses the site, and naming the site turns those into
  # remote URLs that --offline skips rather than fails to resolve. Docs
  # address the repo, where the same flag would misread a sibling
  # `post-body.md` as a page on the site and stop checking it.
  #
  # They divide the markdown on one shared pattern. A file falling between two
  # copies of it would be checked by neither hook, and nothing would say so.
  - repo: local
    hooks:
      - id: lychee-posts
        name: Check links in posts with lychee
        entry: >-
          lychee --config lychee.toml --no-progress --offline
          --base-url https://blog.alunduil.com
        language: system
        types: [markdown]
        files: &post_sources ^src/data/blog/

      - id: lychee-docs
        name: Check links in docs with lychee
        entry: lychee --config lychee.toml --no-progress --offline
        language: system
        types: [markdown]
        exclude: *post_sources

  # A malformed renovate.json fails silently: Renovate surfaces it as a
  # Repository Problem on its next run, never in CI.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.61.3
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # JS/TS/Astro formatting and linting. Local hooks so the repo's own
  # prettier/eslint run — their plugins (prettier-plugin-astro,
  # eslint-plugin-astro, typescript-eslint) and configs resolve from the
  # workspace deps rather than a pinned mirror. Requires node_modules; CI
  # installs them in pre-commit.yml before running the suite.
  - repo: local
    hooks:
      - id: prettier
        name: Format with Prettier
        entry: pnpm exec prettier --write
        language: system
        # Scope lives in .prettierignore (code only; markdown and YAML have
        # dedicated linters). This regex just avoids invoking prettier on
        # files it would skip anyway.
        files: \.(js|mjs|cjs|jsx|ts|tsx|astro|css|json)$
      - id: eslint
        name: Lint with ESLint
        entry: pnpm exec eslint
        language: system
        files: \.(js|mjs|cjs|jsx|ts|tsx|astro)$

  # Baseline file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
        # AstroPaper ships JSONC files in .vscode/ and .devcontainer/.
        exclude: ^(\.vscode/|\.devcontainer/)
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # Prose linting with Vale.
  # Skips AI-targeted markdown (CLAUDE.md, .claude/) and planning docs
  # (outlines/) where terseness beats prose conventions, plus archival
  # republishes (_<engine>/) which are historical text, not current writing.
  - repo: https://github.com/vale-cli/vale
    rev: v3.20.0
    hooks:
      - id: vale
        name: Lint prose with Vale
        args: ["--config=.vale.ini"]
        types: [markdown]
        exclude: &unlinted_md |
          (?x)^(
            CLAUDE\.md|
            \.claude/.*|
            outlines/.*|
            src/data/blog/_.*
          )$

  # Markdown structure linting with markdownlint-cli2.
  # Same exclude as Vale: AI-targeted markdown, planning docs, archival text.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: *unlinted_md
