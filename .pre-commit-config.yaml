---
# Vale ships its style packages under .vale/styles/ as upstream content.
# No hook should touch them.
exclude: ^\.vale/styles/

# nodeenv reads .node-version, whose bare major version it cannot download.
default_language_version:
  node: system

repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]
        types: [shell]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # The system lychee rather than the upstream auto-installing hook: one
  # version pin, and the static musl build runs on images whose GLIBC the
  # upstream binary rejects.
  #
  # --offline holds the gate to what resolves without a build, so it never
  # flakes on a third party; the weekly link check covers the rest.
  #
  # A post's `/posts/...` links address the site, and --base-url turns them
  # into remote URLs that --offline skips rather than fails to resolve. Docs
  # address the repo, where the same flag would misread a sibling
  # `post-body.md` as a page on the site and stop checking it.
  - repo: local
    hooks:
      - id: lychee-posts
        name: Check links in posts with lychee
        entry: >-
          lychee --config lychee.toml --no-progress --offline
          --base-url https://blog.alunduil.com
        language: system
        types: [markdown]
        # Shared with lychee-docs so no file falls between the two unchecked.
        files: &post_sources ^src/data/blog/

      - id: lychee-docs
        name: Check links in docs with lychee
        entry: lychee --config lychee.toml --no-progress --offline
        language: system
        types: [markdown]
        exclude: *post_sources

  # The script checks the whole collection, so it takes no filenames; `files`
  # only decides whether it runs. src/config.ts is in that pattern because
  # the script imports SITE for the default timezone. Needs node_modules.
  - repo: local
    hooks:
      - id: post-scheduling
        name: Check post scheduling
        entry: node scripts/check-post-scheduling.ts
        language: system
        pass_filenames: false
        files: ^(src/data/blog/.*\.md|src/config\.ts)$

  # A malformed renovate.json fails silently: Renovate surfaces it as a
  # Repository Problem on its next run, never in CI.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.69.10
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # Local hooks so the repo's own prettier and eslint run, resolving their
  # plugins and configs from workspace deps rather than a pinned mirror.
  # Needs node_modules.
  - repo: local
    hooks:
      - id: prettier
        name: Format with Prettier
        entry: pnpm exec prettier --write
        language: system
        # Scope lives in .prettierignore; this regex only spares invoking
        # prettier on files it would skip anyway.
        files: \.(js|mjs|cjs|jsx|ts|tsx|astro|css|json)$
      - id: eslint
        name: Lint with ESLint
        entry: pnpm exec eslint
        language: system
        files: \.(js|mjs|cjs|jsx|ts|tsx|astro)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
        # AstroPaper ships JSONC files in .vscode/ and .devcontainer/.
        exclude: ^(\.vscode/|\.devcontainer/)
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/vale-cli/vale
    rev: v3.24.0
    hooks:
      - id: vale
        name: Lint prose with Vale
        args: ["--config=.vale.ini"]
        types: [markdown]
        # Skips AI-targeted markdown and planning docs, where terseness beats
        # prose conventions, and archival republishes, which keep their era's
        # prose.
        exclude: &unlinted_md |
          (?x)^(
            CLAUDE\.md|
            \.claude/.*|
            outlines/.*|
            src/data/blog/_.*|
            \.vale/fixtures/.*
          )$
      # The fixtures hold intentional violations, so the hook above skips
      # them and this one checks each lands where expected. It always runs
      # because the top-level exclude hides the rule files from pre-commit.
      - id: vale
        alias: vale-rules
        name: Check custom Vale rules against fixtures
        entry: scripts/check-vale-rules.sh
        pass_filenames: false
        always_run: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: *unlinted_md
