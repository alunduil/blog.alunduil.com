---
# Pre-commit hooks for code quality and consistency.
# See https://pre-commit.com for usage.

# Vale ships its style packages under .vale/styles/ as upstream content.
# No hook should touch them.
exclude: ^\.vale/styles/

repos:
  # Shell linting and formatting (digest skill collect.sh and any future scripts)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci]
        types: [shell]

  # YAML linting (workflows, frontmatter, pre-commit config itself)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # GitHub Actions workflow linting. v1.7.12+ validates the schedule
  # `timezone:` key used in pages.yml.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Baseline file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
        # AstroPaper ships JSONC files in .vscode/ and .devcontainer/.
        exclude: ^(\.vscode/|\.devcontainer/)
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # Prose linting with Vale.
  # Skips AstroPaper-shipped tutorial posts (upstream content) and AI-targeted
  # markdown (CLAUDE.md, .claude/) where terseness beats prose conventions.
  - repo: https://github.com/vale-cli/vale
    rev: v3.15.1
    hooks:
      - id: vale
        name: Lint prose with Vale
        args: ["--config=.vale.ini"]
        types: [markdown]
        exclude: &upstream_md_exclude |
          (?x)^(
            CLAUDE\.md|
            \.claude/.*|
            src/data/blog/(
              _releases/.*|
              examples/.*|
              _hakyll/.*|
              adding-new-post\.md|
              customizing-.*\.md|
              dynamic-og-images\.md|
              how-to-.*\.md|
              predefined-color-schemes\.md|
              setting-dates-via-git-hooks\.md
            )
          )$

  # Markdown structure linting with markdownlint-cli2.
  # Same exclude as Vale: AstroPaper upstream content + AI-targeted markdown.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: *upstream_md_exclude
